services:
  - type: web
    name: jarastay
    runtime: node
    repo: https://github.com/FaireLegends/jarastay
    branch: main
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jarastay-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: jarastay-db
    plan: free
    region: oregon
    postgresMajorVersion: "18"
    
